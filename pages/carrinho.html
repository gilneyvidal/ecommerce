<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Orçamento | Vidal Design Solutions</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="icon" type="image/png" href="../logo.png">
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    
    <style>
        /* ==========================================
           CORREÇÃO DA LOGO GIGANTE
           ========================================== */
        .logo-header {
            display: flex;
            align-items: center;
            height: 60px;
        }
        
        .logo-header img {
            height: 100%;
            width: auto;
            max-width: 220px;
            object-fit: contain;
        }

        /* Estilos específicos para a tela de conversão */
        body { 
            background-color: var(--gray-100); 
        }
        .cart-container { 
            max-width: 800px; 
            margin: 8rem auto 4rem; 
            padding: 0 1.5rem; 
            min-height: 60vh;
        }
        .cart-card { 
            background: var(--white); 
            border-radius: var(--radius-xl); 
            padding: 2.5rem; 
            box-shadow: var(--shadow-md); 
        }
        .cart-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--gray-200); 
            padding-bottom: 1rem; 
            margin-bottom: 2rem; 
        }
        .cart-item { 
            display: flex; 
            align-items: center; 
            gap: 1.5rem; 
            padding-bottom: 1.5rem; 
            margin-bottom: 1.5rem; 
            border-bottom: 1px solid var(--gray-200); 
        }
        .cart-item-img { 
            width: 90px; 
            height: 90px; 
            border-radius: var(--radius-md); 
            object-fit: cover; 
            background: var(--gray-200); 
            border: 1px solid var(--gray-200);
        }
        .cart-item-info { 
            flex-grow: 1; 
        }
        .cart-item-title { 
            font-weight: 700; 
            color: var(--dark); 
            font-size: 1.15rem; 
            margin-bottom: 0.25rem;
        }
        .cart-item-price { 
            color: var(--primary); 
            font-weight: 600; 
            font-size: 0.95rem;
        }
        .cart-actions { 
            display: flex; 
            align-items: center; 
            gap: 1rem; 
        }
        .qty-input { 
            width: 70px; 
            padding: 0.5rem; 
            border: 2px solid var(--gray-300); 
            border-radius: var(--radius-sm); 
            text-align: center; 
            font-weight: 600;
            font-family: var(--font-body);
        }
        .qty-input:focus {
            border-color: var(--primary);
            outline: none;
        }
        .remove-btn { 
            color: #ef4444; 
            background: none; 
            border: none; 
            cursor: pointer; 
            font-size: 1.25rem; 
            transition: var(--transition-fast); 
            padding: 0.5rem;
        }
        .remove-btn:hover { 
            color: #b91c1c; 
            transform: scale(1.1); 
        }
        .cart-summary { 
            margin-top: 3rem; 
            background: var(--gray-50); 
            padding: 2rem; 
            border-radius: var(--radius-lg); 
            text-align: right; 
            border: 1px solid var(--gray-200);
        }
        .cart-total { 
            font-size: 1.75rem; 
            font-family: var(--font-heading); 
            font-weight: 800; 
            color: var(--dark); 
            margin-bottom: 0.5rem; 
        }
        .cart-disclaimer {
            font-size: 0.85rem; 
            color: var(--gray-500); 
            margin-bottom: 2rem;
            font-style: italic;
        }
        .empty-cart { 
            text-align: center; 
            padding: 4rem 0; 
            color: var(--gray-500); 
        }
        .empty-cart i { 
            font-size: 5rem; 
            margin-bottom: 1.5rem; 
            color: var(--gray-300); 
        }
        .back-link { 
            display: inline-flex; 
            align-items: center; 
            gap: 0.5rem; 
            color: var(--primary); 
            font-weight: 600; 
            margin-bottom: 1.5rem; 
            text-decoration: none; 
            transition: var(--transition-fast);
        }
        .back-link:hover { 
            color: var(--secondary);
            transform: translateX(-5px);
        }
        
        @media (max-width: 768px) {
            .cart-item { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .cart-actions { width: 100%; justify-content: space-between; }
            .cart-card { padding: 1.5rem; }
            .cart-summary { text-align: center; }
        }
    </style>
</head>
<body>
    <header class="header scrolled">
        <div class="container">
            <div class="header-content" style="justify-content: center;">
                <a href="../index.html" class="logo-header">
                    <img src="../logo_cabecalho.png" alt="Vidal Design Solutions - Logo">
                </a>
            </div>
        </div>
    </header>

    <div class="cart-container">
        <a href="../index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Voltar para o Catálogo
        </a>
        
        <div class="cart-card">
            <div class="cart-header">
                <h2>Revisar Orçamento</h2>
                <span id="cartItemCount" style="color: var(--gray-600); font-weight: 600; background: var(--gray-100); padding: 0.25rem 0.75rem; border-radius: 1rem;">0 itens</span>
            </div>
            
            <div id="cartItemsContainer"></div>
            
            <div class="cart-summary" id="cartSummary" style="display: none;">
                <div class="cart-total">
                    Estimativa Base: <span id="cartTotalValue" style="color: var(--primary);">R$ 0,00</span>
                </div>
                <p class="cart-disclaimer">
                    * Este é um valor de referência para facilitar seu planejamento. O valor final pode sofrer alterações após a análise técnica da sua arte e das medidas exatas.
                </p>
                <button onclick="sendCartViaWhatsApp()" class="btn btn-primary" style="width: 100%; justify-content: center; font-size: 1.1rem; padding: 1.25rem; border-radius: var(--radius-xl);">
                    <i class="fab fa-whatsapp" style="font-size: 1.5rem;"></i> Enviar Pedido para o WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script src="../assets/js/cart.js"></script>
    <script>
        function formatCurrencyUI(value) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        }

        function renderCartPage() {
            const container = document.getElementById('cartItemsContainer');
            const summary = document.getElementById('cartSummary');
            const countBadge = document.getElementById('cartItemCount');
            const totalValue = document.getElementById('cartTotalValue');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>Sua lista de orçamento está vazia</h3>
                        <p style="margin-top: 0.5rem; margin-bottom: 2rem;">Adicione produtos do catálogo para que possamos avaliar seu projeto.</p>
                        <a href="../index.html#produtos" class="btn btn-secondary">Explorar Produtos</a>
                    </div>
                `;
                summary.style.display = 'none';
                countBadge.textContent = '0 itens';
                return;
            }
            
            container.innerHTML = '';
            let total = 0;
            let itemsCount = 0;
            
            cart.forEach(item => {
                total += item.basePrice * item.quantity;
                itemsCount += item.quantity;
                
                // AJUSTE DE CAMINHO: Garante que o carrinho ache a imagem na nova estrutura
                const imgPath = item.image.includes('placeholder') ? item.image : `../${item.image}`;
                
                const itemElement = document.createElement('div');
                itemElement.className = 'cart-item';
                itemElement.innerHTML = `
                    <img src="${imgPath}" alt="${item.name}" class="cart-item-img">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-price">${formatCurrencyUI(item.basePrice)} <span style="font-size:0.8em; color:var(--gray-500); font-weight:400;">(valor un. ref.)</span></div>
                    </div>
                    <div class="cart-actions">
                        <input type="number" class="qty-input" value="${item.quantity}" min="1" 
                            onchange="updateQuantity('${item.id}', this.value)">
                        <button class="remove-btn" onclick="removeFromCart('${item.id}')" title="Remover este item">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
                container.appendChild(itemElement);
            });
            
            countBadge.textContent = `${itemsCount} item(ns)`;
            totalValue.textContent = formatCurrencyUI(total);
            summary.style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', renderCartPage);
    </script>
</body>
</html>
